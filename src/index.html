<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Marcy Music</title>
</head>
<body>
    <header class="top-bar">
        
        <nav>
            <img src="img/logo.png" alt="Logo">
            <h1>Marcy Music</h1>
            <div>
                <ul class="list">
                    <li><a href="">Library</a></li>
                    <li><a href="">Explore</a></li>
                    <li><a href="">Profile</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <h2 class="playlist">Playlists</h2>
            
    
        <div class="playlist-grid-container">
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-chill.jpg" alt="Chill vibes playlist">
                    <figcaption>
                        <p class="playlist-p">Chill Vibes</p>
                    </figcaption>
                </figure>
            </div>
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-focus.jpg" alt="Focus playlist">
                    <figcaption>
                        <p class="playlist-p">Focus</p>
                    </figcaption>
                </figure>
            </div>
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-late-night.jpg" alt="Late night playlist">
                    <figcaption>
                        <p class="playlist-p">Late Night</p>
                    </figcaption>
                </figure>
            </div>
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-love.jpg" alt="Love songs playlist">
                    <figcaption>
                        <p class="playlist-p">Love Songs</p>
                    </figcaption>
                </figure>
            </div>
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-oldies.jpg" alt="Oldies playlist">
                    <figcaption>
                        <p class="playlist-p">Oldies</p>
                    </figcaption>
                </figure>
            </div>
            <div class="playlist-item">
                <figure>
                    <img class="playlist-img" src="img/playlist-sad.jpg" alt="Sad playlist">
                    <figcaption>
                        <p class="playlist-p">Sad</p>
                    </figcaption>
                </figure>
            </div>
        </div>
    </section>


    <section>
        <h2 class="album">Albums</h2>
        
        <div class="album-grid-container">
            <div class="album-item">
                <figure>
                    <img src="img/album-midnight-dreams.jpg" alt="Midnight dreams album">
                    <figcaption>
                        <p>Midnight Dreams</p>
                        <p>Luna Ray</p>
                    </figcaption>
                </figure>
            </div>
        <div class="album-item">
            <figure>
                <img src="img/album-electric-soul.jpg" alt="Electric soul album">
                <figcaption>
                    <p>Electric Soul</p>
                    <p>The Voltage</p>
                </figcaption>
            </figure>
        </div>
        <div class="album-item">
            <figure>
                <img src="img/album-golden-hour.jpg" alt="Golden hour album">
                <figcaption>
                    <p>Golden hour</p>
                    <p>Sunset Collective</p>
                </figcaption>
            </figure>
        </div>
        <div class="album-item">
            <figure>
                <img src="img/album-kermit-does-jazz.jpg" alt="Kermit does jazz album">
                <figcaption>
                    <p>Kermit Does Jazz</p>
                    <p>Kermit The Frog</p>
                </figcaption>
            </figure>
        </div>
        </div>
    </section>
    </main>
    <footer>
        <p>
            Made with ❤️ at Marcy Lab School
        </p>
    </footer>
</body>
</html>
